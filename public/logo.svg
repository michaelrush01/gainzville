<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>Gainzville</title>
  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d2c0ff"/>
      <stop offset="1" stop-color="#8f6cf0"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a57e0"/>
      <stop offset="1" stop-color="#5b3cc4"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#b79cff" stroke-opacity="0.07" stroke-width="2"/>
    </pattern>
    <clipPath id="tile"><rect width="512" height="512" rx="112"/></clipPath>
  </defs>

  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="#120e1f"/>
    <rect width="512" height="512" fill="url(#grid)"/>

    <!-- massive neck and traps, running off the bottom of the tile -->
    <path d="M70 512 C 60 430 70 360 112 312 L 176 300 C 196 360 236 400 300 420 C 330 430 350 470 352 512 Z" fill="url(#shade)"/>
    <path d="M70 512 C 64 450 78 392 118 350 C 120 400 150 450 190 512 Z" fill="url(#skin)" opacity="0.55"/>
    <path d="M128 380 C 150 420 190 452 240 470" fill="none" stroke="#120e1f" stroke-width="8" stroke-linecap="round" opacity="0.28"/>

    <!-- dumbbell clamped in the jaws -->
    <rect x="150" y="268" width="300" height="20" rx="10" fill="#e6ddff"/>
    <rect x="418" y="214" width="40" height="128" rx="12" fill="#e6ddff"/>
    <rect x="454" y="236" width="30" height="84" rx="10" fill="#e6ddff"/>

    <!-- upper jaw and skull -->
    <path d="M96 300 C 92 232 128 168 196 146 C 220 118 268 112 292 140 L 404 168 C 434 176 452 196 452 222 L 452 240 C 452 254 440 262 426 262 L 150 280 Z" fill="url(#skin)"/>
    <!-- scutes along the snout -->
    <path d="M304 150 l 14 -16 l 14 20 M 342 160 l 14 -14 l 12 18 M 378 170 l 12 -11 l 10 16" fill="none" stroke="#120e1f" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.3"/>
    <circle cx="430" cy="194" r="7" fill="#120e1f" opacity="0.5"/>

    <!-- sweatband -->
    <path d="M150 168 C 190 140 240 126 288 132 L 296 160 C 250 154 204 166 166 194 Z" fill="#120e1f"/>
    <path d="M156 176 C 194 150 240 138 286 142" fill="none" stroke="#b79cff" stroke-width="5" stroke-linecap="round"/>

    <!-- heavy brow + focused eye -->
    <ellipse cx="236" cy="198" rx="20" ry="16" fill="#120e1f"/>
    <circle cx="242" cy="198" r="7" fill="#f1eef8"/>
    <path d="M200 186 L 272 176" stroke="#120e1f" stroke-width="12" stroke-linecap="round"/>

    <!-- teeth over the bar -->
    <path d="M200 279 l 9 17 l 9 -17 M 252 276 l 9 17 l 9 -17 M 346 271 l 9 16 l 9 -16 M 392 268 l 9 15 l 8 -15" fill="#f1eef8"/>

    <!-- lower jaw -->
    <path d="M118 300 L 420 286 C 436 286 444 296 440 310 C 434 330 414 340 390 342 L 190 356 C 150 358 120 338 118 300 Z" fill="url(#skin)"/>
    <path d="M214 290 l 9 -15 l 9 16 M 318 286 l 9 -15 l 9 16 M 370 284 l 8 -14 l 8 15" fill="#f1eef8"/>
    <!-- jaw muscle -->
    <path d="M132 304 C 140 324 160 336 186 338" fill="none" stroke="#120e1f" stroke-width="7" stroke-linecap="round" opacity="0.28"/>
  </g>
</svg>
